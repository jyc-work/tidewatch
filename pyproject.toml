[project]
name = "tidewatch"
version = "0.1.0"
description = "A 股市场图谱（观潮）：板块 / 游资 / 资金雷达，离线快照 + 静态发布"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tidewatch = ["holidays_cn.json", "assets/*"]

[project.scripts]
tidewatch = "tidewatch.cli:main"
